name: Deploy
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
# A newer push waits for the running deploy instead of cancelling it (a cancelled run says nothing about the push).
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test --if-present
      - run: npm run build
      - run: npm run a11y:scan --if-present
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: playwright-report, path: playwright-report, retention-days: 14}
      - uses: actions/upload-pages-artifact@v4
        with: {path: dist}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: '${{ steps.d.outputs.page_url }}'}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
