name: Deploy
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
# A newer push waits for the running deploy instead of cancelling it (a cancelled run says nothing about the push).
concurrency: {group: pages, cancel-in-progress: false}
# build → e2e and the accessibility scan (three shards) side by side → publish (results folded into the site) → deploy.
# A red typecheck, unit test, build or e2e deploys nothing; the scan never fails the run (accessibility is reported).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: {name: site, path: dist, retention-days: 1}
  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with: {name: site, path: dist}
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: playwright-report, path: playwright-report, retention-days: 14}
  a11y:
    needs: build
    runs-on: ubuntu-latest
    strategy: {matrix: {shard: [1, 2, 3]}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with: {name: site, path: dist}
      - run: npm run a11y:scan
        # A shard that dies costs the page its stories, never the deploy: publish folds the shards that finished.
        continue-on-error: true
        env: {A11Y_SHARD: '${{ matrix.shard }}/3'}
      - uses: actions/upload-artifact@v4
        with: {name: 'a11y-${{ matrix.shard }}', path: 'dist/storybook/a11y-raw-${{ matrix.shard }}.json', retention-days: 1}
  publish:
    needs: [e2e, a11y]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: {name: site, path: dist}
      - uses: actions/download-artifact@v4
        with: {pattern: 'a11y-*', path: dist/storybook, merge-multiple: true}
      - run: npm run a11y:scan -- --merge && rm dist/storybook/a11y-raw-*.json
      - uses: actions/upload-pages-artifact@v4
        with: {path: dist}
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: '${{ steps.d.outputs.page_url }}'}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
