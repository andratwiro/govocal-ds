<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* The Storybook chrome in Go Vocal's paint. Colours and type are var(--gv-*) from tokens.css, which
     theme.ts loads into the manager. Storybook adds its own styles after this block, so the rules
     start from an id to win ties. */

  /* Brand: the mark and "Design system". */
  #storybook-sidebar-region .gv-sb-brand {
    display: inline-flex;
    align-items: center;
    gap: var(--gv-space-10);
    font: var(--gv-type-title);
    font-weight: 600;
    letter-spacing: var(--gv-type-title-tracking);
    color: var(--gv-text-primary);
    white-space: nowrap;
  }
  #storybook-sidebar-region .gv-sb-brand img {
    display: block;
    inline-size: var(--gv-space-24);
    block-size: var(--gv-space-24);
  }

  /* Section labels in sentence case, Small strong, like the system's own rail labels. */
  #storybook-explorer-tree .sidebar-subheading [data-action='collapse-root'] {
    font: var(--gv-type-small-strong);
    letter-spacing: var(--gv-type-small-strong-tracking);
    text-transform: none;
    color: var(--gv-text-secondary);
  }

  /* Tree rows: rounder; the selected row is the system's selected segment (panel, segment shadow,
     strong text) instead of a filled bar. */
  #storybook-explorer-tree .sidebar-item {
    border-radius: var(--gv-radius-8);
  }
  #storybook-explorer-tree .sidebar-item[data-selected='true'],
  #storybook-explorer-tree .sidebar-item[data-selected='true']:hover,
  #storybook-explorer-tree .sidebar-item[data-selected='true']:focus {
    background: var(--gv-surface-panel);
    box-shadow: var(--gv-shadow-segment-selected);
    color: var(--gv-text-primary);
    font-weight: 500;
  }
  #storybook-explorer-tree .sidebar-item[data-selected='true'] svg {
    color: var(--gv-icon-strong);
  }

  /* Type icons (the svg straight inside the row's icon slot; the expand chevron sits one level deeper):
     docs in the mark's coral, components in the brand teal, stories in the strong icon grey (3:1 on the mint). */
  #storybook-explorer-tree .sidebar-item > :is(a, button) > div:first-child > svg {
    color: var(--gv-icon-strong);
  }
  #storybook-explorer-tree .sidebar-item[data-nodetype='document'] > a > div:first-child > svg {
    color: var(--gv-color-red-450);
  }
  #storybook-explorer-tree .sidebar-item[data-nodetype='component'] > button > div:first-child > svg,
  #storybook-explorer-tree .sidebar-item[data-nodetype='group'] > button > div:first-child > svg {
    color: var(--gv-surface-brand-mark);
  }

  /* Search: a system field (panel, control border, radius 8). */
  #storybook-sidebar-region .search-field {
    border-radius: var(--gv-radius-8);
  }
  #storybook-explorer-searchfield {
    font: var(--gv-type-ui);
    color: var(--gv-text-primary);
  }
  /* Secondary, not the system's placeholder grey (3.2:1): the chrome's text stays AA. */
  #storybook-explorer-searchfield::placeholder {
    color: var(--gv-text-secondary);
  }
</style>
<script>
  // Old links after the naming revamp (29 Oct 2026, docs/NAMING.md): a moved entry's ?path= is rewritten before
  // Storybook reads it. One line per moved title (old id prefix: new one); drop this block after a month.
  (function () {
    var MOVED = {
      'base-button': 'components-actions-button',
      'components-button-\u00b7-compact': 'components-actions-compact-button',
      'components-icon-button': 'components-actions-icon-button',
      'components-segmented-control': 'components-actions-segmented-control',
      'components-bar-row': 'components-charts-bar-row',
      'components-chart': 'components-charts-chart',
      'components-dashboard-card': 'components-charts-dashboard-card',
      'components-legend-row': 'components-charts-legend-row',
      'components-statement-row': 'components-charts-statement-row',
      'components-avatar': 'components-data-display-avatar',
      'components-data-table': 'components-data-display-data-table',
      'components-list-header': 'components-data-display-list-header',
      'components-list-header-cell': 'components-data-display-list-header-cell',
      'components-list-row': 'components-data-display-list-row',
      'components-stat-row': 'components-data-display-stat-row',
      'components-kpi': 'components-data-display-stat-tile',
      'components-checkbox': 'components-forms-checkbox',
      'components-drop-zone': 'components-forms-drop-zone',
      'components-required': 'components-forms-required-marker',
      'components-editor': 'components-forms-rich-text-editor',
      'components-editor-toolbar': 'components-forms-rich-text-toolbar',
      'components-editor-tool': 'components-forms-rich-text-toolbar-button',
      'components-title-field': 'components-forms-title-field',
      'components-card': 'components-layout-containers-card',
      'components-divider': 'components-layout-containers-divider',
      'components-breadcrumb': 'components-navigation-breadcrumbs',
      'components-coachmark': 'components-overlays-coachmark',
      'components-modal': 'components-overlays-modal',
      'components-pill': 'components-status-feedback-badge',
      'components-banner': 'components-status-feedback-banner',
      'components-new-dot': 'components-status-feedback-new-dot',
      'components-review-notice': 'components-status-feedback-review-status',
      'components-skeleton': 'components-status-feedback-skeleton',
      'components-status': 'components-status-feedback-status-badge',
      'components-header': 'patterns-project-page-project-header',
      'components-setup-card': 'patterns-project-page-setup-step',
      'components-rail-header': 'patterns-project-rail-rail-header',
      'components-rail-phase': 'patterns-project-rail-rail-phase',

      'components-cause-row': 'patterns-participation-methods-volunteering-row',
      'components-vote-progress': 'patterns-participation-methods-vote-progress',
      'patterns-help-popover': 'patterns-app-shell-help-popover',
      'patterns-notification-list': 'patterns-app-shell-notification-list',
      'patterns-side-nav': 'patterns-app-shell-side-nav',
      'patterns-section-toggle': 'patterns-pages-menu-section-toggle',
      'patterns-action-row': 'patterns-project-page-action-row',
      'patterns-panel-section': 'patterns-project-page-panel-section',
      'patterns-stat-card': 'patterns-project-page-stat-card',
      'patterns-phone-preview': 'patterns-project-page-phone-preview',
      'patterns-phase-timeline': 'patterns-project-rail-phase-timeline',
      'patterns-filter-chips': 'patterns-lists-filter-chips',
      'patterns-filter-menu': 'patterns-lists-filter-menu',
      'patterns-filter-options': 'components-forms-option-list',
      'patterns-selection-bar': 'patterns-lists-selection-bar',
      'patterns-manage-tab-filter-chips': 'patterns-lists-filter-chips',
      'patterns-manage-tab-filter-menu': 'patterns-lists-filter-menu',
      'patterns-manage-tab-filter-options': 'components-forms-option-list',
      'patterns-manage-tab-selection-bar': 'patterns-lists-selection-bar',
      'overview-foundations': 'foundations-colour',
      'overview-icons': 'foundations-icons',
      'base-toast': 'components-status-feedback-toast',
      'base-tooltip': 'components-overlays-tooltip',
      'patterns-app-shell-help-popover': 'components-overlays-help-popover',
      'base-switch': 'components-forms-switch',
      'base-textfield': 'components-forms-text-field',
      'base-numberfield': 'components-forms-number-field',
      'patterns-lists-filter-options': 'components-forms-option-list',
      'base-select': 'components-forms-select',
      'base-menu': 'components-actions-menu'
    };
    var u = new URL(location.href), m = (u.searchParams.get('path') || '').match(/^\/(story|docs)\/(.+?)--(.+)$/);
    if (m && MOVED[m[2]]) {
      u.searchParams.set('path', '/' + m[1] + '/' + MOVED[m[2]] + '--' + m[3]);
      history.replaceState(null, '', u);
    }
  })();
</script>
