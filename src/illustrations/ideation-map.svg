  <g class="pop pa" transform="translate(76 98) rotate(10.5)"><g class="pg"><g transform="translate(-21 7)">
    <rect class="paper" width="75" height="64" rx="1.33"/>
    <text class="who" x="8" y="15.2">Kai</text>
    <text class="say" x="8" y="27.2">Fix the potholes<tspan x="8" dy="8.67">on Mill Road</tspan></text>
  </g></g></g>
  <g class="pop pb" transform="translate(241 69) rotate(-9.5)"><g class="pg"><g transform="translate(-43 6)">
